---
- name: Render DBCA response file
  ansible.builtin.template:
    src: dbca.rsp.j2
    dest: /tmp/dbca.rsp
    owner: oracle
    group: oinstall
    mode: "0600"

- name: Create database silently
  ansible.builtin.command:
    cmd: "{{ oracle_home }}/bin/dbca -silent -createDatabase -responseFile /tmp/dbca.rsp"
  become_user: oracle
  args:
    creates: "{{ oracle_data_dir }}/{{ oracle_db_name }}/{{ oracle_db_name }}.dbf"
  no_log: true

- name: Render listener configuration
  ansible.builtin.template:
    src: listener.ora.j2
    dest: "{{ oracle_home }}/network/admin/listener.ora"
    owner: oracle
    group: oinstall
    mode: "0640"
  notify: Restart Oracle listener

- name: Render tnsnames configuration
  ansible.builtin.template:
    src: tnsnames.ora.j2
    dest: "{{ oracle_home }}/network/admin/tnsnames.ora"
    owner: oracle
    group: oinstall
    mode: "0640"

- name: Install database start script
  ansible.builtin.copy:
    src: oracle-db-start.sql
    dest: /usr/local/sbin/oracle-db-start.sql
    owner: root
    group: root
    mode: "0755"

- name: Install database stop script
  ansible.builtin.copy:
    src: oracle-db-stop.sql
    dest: /usr/local/sbin/oracle-db-stop.sql
    owner: root
    group: root
    mode: "0755"

- name: Enable Oracle database service
  ansible.builtin.template:
    src: oracle-db.service.j2
    dest: /etc/systemd/system/oracle-db.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Enable Oracle database service
  when: oracle_manage_service | bool

- name: Remove temporary DBCA response file
  ansible.builtin.file:
    path: /tmp/dbca.rsp
    state: absent
