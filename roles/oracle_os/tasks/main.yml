---
- name: Install Oracle prerequisite packages
  ansible.builtin.package:
    name:
      - bc
      - binutils
      - elfutils-libelf
      - gcc
      - gcc-c++
      - glibc
      - glibc-devel
      - ksh
      - libaio
      - libaio-devel
      - libgcc
      - libstdc++
      - libstdc++-devel
      - make
      - net-tools
      - nfs-utils
      - openssh-clients
      - unzip
      - zip
    state: present

- name: Create Oracle groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - oinstall
    - dba
    - oper

- name: Create Oracle user
  ansible.builtin.user:
    name: oracle
    group: oinstall
    groups: dba,oper
    append: true
    shell: /bin/bash
    create_home: true
    home: /home/oracle

- name: Create Oracle directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: oracle
    group: oinstall
    mode: "{{ '0775' if item == oracle_install_media | dirname else '0770' }}"
  loop:
    - "{{ oracle_base }}"
    - "{{ oracle_home }}"
    - "{{ oracle_inventory_loc }}"
    - "{{ oracle_data_dir }}"
    - "{{ oracle_fast_recovery_dir }}"
    - "{{ oracle_sw_unpack_dir }}"

- name: Configure Oracle limits
  ansible.builtin.copy:
    dest: /etc/security/limits.d/oracle-database.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      oracle soft nofile 1024
      oracle hard nofile 65536
      oracle soft nproc 16384
      oracle hard nproc 16384
      oracle soft stack 10240
      oracle hard stack 32768
      oracle soft memlock unlimited
      oracle hard memlock unlimited

- name: Configure kernel parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-oracle-database.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      fs.aio-max-nr = 1048576
      fs.file-max = 6815744
      kernel.sem = 250 32000 100 128
      net.ipv4.ip_local_port_range = 9000 65500
      net.core.rmem_default = 262144
      net.core.rmem_max = 4194304
      net.core.wmem_default = 262144
      net.core.wmem_max = 1048576
  notify: Reload sysctl
  when: oracle_manage_kernel | bool

- name: Open Oracle listener port
  ansible.posix.firewalld:
    port: "{{ oracle_listener_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: oracle_manage_firewall | bool
